<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор Душевного Бати</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f0f2f5; color: #1c1e21; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: white; width: 100%; max-width: 500px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); padding: 25px; display: flex; flex-direction: column; min-height: 400px; justify-content: space-between; }
        h1 { font-size: 24px; text-align: center; color: #333; margin-bottom: 10px; }
        .score-board { display: flex; justify-content: space-around; background: #f7f8fa; padding: 10px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; font-weight: bold; }
        .text-box { font-size: 18px; line-height: 1.5; color: #444; margin-bottom: 30px; flex-grow: 1; display: flex; align-items: center; text-align: center; justify-content: center; }
        .btn { display: block; width: 100%; background: #007aff; color: white; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 12px; transition: background 0.2s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
        .btn:active { background: #0056b3; transform: scale(0.98); }
        .btn-restart { background: #34c759; }
        .btn-restart:active { background: #248a3d; }
    </style>
</head>
<body>

<div class="card" id="game-card">
    <h1 id="title">Симулятор Бати 👑</h1>
    <div class="score-board" id="score-view">
        <span id="p-ideal">Идеал: 0</span>
        <span id="p-pofi">Пофигизм: 0</span>
    </div>
    <div class="text-box" id="text-container">Нажмите кнопку ниже, чтобы начать игру!</div>
    <div id="buttons-container">
        <button class="btn" onclick="startGame()">Начать игру</button>
    </div>
</div>

<script>
    const questions = [
        {
            text: "Твой сын доказывает тебе, что по правилам русского языка будет правильно писать красавщик и супщик. Твои действия:",
            answers: [
                { text: "Шутить про это несколько лет", type: "ideal" },
                { text: "Нормально объяснить как правильно писать", type: "soft" }
            ]
        },
        {
            text: "Твой сын 'прочитал книгу' и когда он тебе ее пересказывает, он говорит про белого негра, упоминаемого в рассказе. Твои действия:",
            answers: [
                { text: "Посмеяться с этого и не заставлять его перечитывать", type: "ideal" },
                { text: "Сказать ему, что он невнимательный и отправить перечитывать", type: "strict" }
            ]
        },
        {
            text: "Ты услышал странные звуки в 6 утра. Твои действия:",
            answers: [
                { text: "Разбудить пол дома, чтобы идти доставать оленя из ворот", type: "ideal" },
                { text: "Забить и дальше спать", type: "pofi" }
            ]
        },
        {
            text: "Твой сын отпросился погулять еще 5 минут и пропал. Твои действия:",
            answers: [
                { text: "Идти искать его по району", type: "ideal" },
                { text: "Стоять и ждать его", type: "pofi" }
            ]
        },
        {
            text: "Ты заметил, что вещь тебе мала или ты ее давно не надевал. Твои действия:",
            answers: [
                { text: "Отдать сыну", type: "ideal" },
                { text: "Выкинуть", type: "pofi" }
            ]
        },
        {
            text: "Ситуация: ты встал самый первый в выходной. Варианты действий:",
            answers: [
                { text: "Приготовить лучшую в мире авторскую яичницу", type: "ideal" },
                { text: "Смотреть ВК видео", type: "pofi" }
            ]
        }
    ];

    let currentStep = 0;
    let scores = { ideal: 0, pofi: 0, soft: 0, strict: 0 };

    function updateScoreBoard() {
        document.getElementById('p-ideal').innerText = `Идеал: ${scores.ideal}`;
        document.getElementById('p-pofi').innerText = `Пофигизм: ${scores.pofi}`;
    }

    function startGame() {
        currentStep = 0;
        scores = { ideal: 0, pofi: 0, soft: 0, strict: 0 };
        document.getElementById('score-view').style.display = 'flex';
        updateScoreBoard();
        showQuestion();
    }

    function showQuestion() {
        if (currentStep < questions.length) {
            const q = questions[currentStep];
            document.getElementById('text-container').innerText = q.text;
            const btnContainer = document.getElementById('buttons-container');
            btnContainer.innerHTML = '';
            
            q.answers.forEach(ans => {
                const button = document.createElement('button');
                button.className = 'btn';
                button.innerText = ans.text;
                button.onclick = () => handleAnswer(ans.type);
                btnContainer.appendChild(button);
            });
        } else {
            showResult();
        }
    }

    function handleAnswer(type) {
        scores[type]++;
        updateScoreBoard();
        currentStep++;
        showQuestion();
    }

    function showResult() {
        document.getElementById('score-view').style.display = 'none';
        const txt = document.getElementById('text-container');
        const btnContainer = document.getElementById('buttons-container');
        
        let title = "";
        if (scores.ideal >= 4) {
            title = "🏆 ЛУЧШИЙ В МИРЕ БАТЯ (ИДЕАЛ)! Выбор настоящего шеф-повара авторской яичницы и спасителя оленей!";
        } else if (scores.pofi >= 3) {
            title = "😎 ДЗЕН-БАТЯ. Абсолютное спокойствие в любой непонятной ситуации.";
        } else {
            title = "❤️ ДУШЕВНЫЙ И СТРОГИЙ ПАПА. Настоящий семейный стержень с отличным чувством юмора!";
        }

        txt.innerHTML = `<b>Игра окончена!</b><br><br>Твой итоговый титул:<br><br><span style="font-size:20px; color:#34c759;">${title}</span><br><br>Спасибо, что ты у нас есть!`;
        btnContainer.innerHTML = '<button class="btn btn-restart" onclick="startGame()">Играть снова</button>';
    }
</script>
</body>
</html>
